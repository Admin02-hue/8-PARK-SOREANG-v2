# Netlify Configuration for Next.js
# ==================================

[build]
command = "npm run build"
publish = ".next"
functions = ".netlify/functions"

# Environment variables
[build.environment]
NODE_VERSION = "20"
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"

# Headers untuk performa dan keamanan
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "SAMEORIGIN"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"

# Headers untuk static assets
[[headers]]
for = "/_next/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Headers untuk public assets
[[headers]]
for = "/public/*"
[headers.values]
Cache-Control = "public, max-age=31536000"

# Plugins Netlify untuk Next.js
[[plugins]]
package = "@netlify/plugin-nextjs"

# Rewrites untuk Next.js routing
[[redirects]]
from = "/*"
to = "/404"
status = 404
conditions = { "NOT": [{"Cookie": "nf_ab=*"}, {"Cookie": "ab=*"}] }

# Redirect trailing slashes
[[redirects]]
from = "/:path/*"
to = "/:path"
status = 301
force = false

